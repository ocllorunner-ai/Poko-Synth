name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p out
          cp synth/build/outputs/apk/release/*.apk out/PokoSynth.apk
          cp keys/build/outputs/apk/release/*.apk out/PokoKeys.apk

      - uses: actions/upload-artifact@v4
        with:
          name: poko-apks
          path: out/*.apk
